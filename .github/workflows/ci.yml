# AD-31's verification floor, run by something other than a person remembering.
#
# The four commands are the gate every story in this spec inherits, and they were only ever run by hand:
# a story could be finished on a machine whose Node, node_modules or lockfile differed from the declared
# ones and nothing would say so. This workflow is that gate, on a clean checkout, on the pinned Node.
#
# Each command is its own step rather than one `&&` chain, because a job whose failure names the command
# that failed is the difference between "CI is red" and "lint is red". GitHub stops a job at the first
# failing step, so any one of the four failing fails the job — which is the acceptance criterion.
name: CI

# push only: every ref update runs the gate. (`pull_request` was dropped so a PR from a branch in
# this same repository doesn't double the run count against the same commit.)
on:
  push:

# The gate is read-only. Nothing here writes to the repository, so the token gets nothing but contents.
permissions:
  contents: read

# One run per ref, and the newest wins.
#
# The suite now spawns real child processes — seven jiti-compiling children per cross-process race, three
# races — so three pushes in a minute would otherwise have three copies of that contending for the same
# runners while two of them are already answering a question nobody is asking any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pinned Node: the floor as `.nvmrc` declares it, which is what the Stack table promises.
  gate:
    name: typecheck, lint, build, test
    runs-on: ubuntu-latest
    # A hang must fail rather than run for six hours. The cross-process races carry their own 180s bound
    # inside Vitest; this is the outer one, for a wedged child that never reaches an assertion at all.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Node version is read from `.nvmrc`, never written here. AD-28 declares the floor in exactly
      # two places — `.nvmrc` and `package.json` `engines.node` — and a literal in this file would be a
      # third, free to drift from both. `.npmrc` sets `engine-strict=true`, so `npm ci` then enforces
      # `engines` against it rather than warning and installing anyway.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: it installs the lockfile exactly and fails if the lockfile and the manifest
      # disagree, so the gate runs against the declared dependency tree rather than a resolved-today one.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The newest Node, which is where every story's evidence has actually been gathered.
  #
  # `engines.node` is a floor — `>=22.22` — so the build claims to work on everything above it, and CI
  # was checking exactly one point of that range while all the local verification happened on 24.x. A
  # floor nothing tests above is a floor, not a range. `current` is an alias rather than a literal, so
  # this row cannot become a third declaration of the version the other row pins.
  gate-current:
    name: typecheck, lint, build, test (current Node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: current
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
